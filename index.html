<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTEP Inventory & Barcode Scanner</title>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f6f8;
      color: #333;
    }
    .container {
      max-width: 650px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    h2 { margin: 0 0 16px 0; text-align: center; }
    .status-badge {
      display: inline-block;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #e2f0d9;
      color: #385723;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
      width: 100%;
    }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    button {
      flex: 1;
      min-width: 130px;
      padding: 12px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-green { background: #04844b; color: white; }
    .btn-blue { background: #0056b3; color: white; }
    .btn-danger { background: #c82333; color: white; }
    .btn-gray { background: #6c757d; color: white; }

    label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .status-msg {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 14px;
      display: none;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th { background: #f0f0f0; }
  </style>
</head>
<body>

<div class="container">
  <h2>📦 UTEP Barcode Scanner</h2>
  <div class="status-badge">⚡ Connected directly to Google Sheets (barcodes)</div>

  <label for="utepTagInput">UTEP TAG (Optional, applied to next scan):</label>
  <input type="text" id="utepTagInput" placeholder="e.g. UTEP-3D-042" />

  <div id="reader"></div>

  <div class="btn-row">
    <button class="btn-green" id="startBtn" onclick="startScanner()">▶ Start Camera</button>
    <button class="btn-gray" id="stopBtn" onclick="stopScanner()" disabled>⏹ Stop Camera</button>
  </div>

  <div id="alertBox" class="status-msg"></div>

  <div class="btn-row">
    <button class="btn-blue" onclick="exportToExcel()">📥 Download Backup (.xlsx)</button>
    <button class="btn-danger" onclick="clearTable()">🗑 Reset Local List</button>
  </div>

  <h3>Unique Scans (<span id="count">0</span>)</h3>
  <table id="scansTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Barcode / 2D Value</th>
        <th>UTEP TAG</th>
        <th>Format</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  // ============================================================
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ONCE
  // ============================================================
  const SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzLr3rvfN59rSS6YRGydXQajMScb-fzcKlmPsyRomxEbIFscObmzY00XyYPVYeTa85q/exec";

  let scannedItems = [];
  let scannedSet = new Set();
  let html5QrCode;
  let isScanning = false;
  let isProcessingScan = false;

  function showAlert(msg, bg = '#d4edda', color = '#155724') {
    const box = document.getElementById("alertBox");
    box.style.background = bg;
    box.style.color = color;
    box.innerText = msg;
    box.style.display = "block";
    setTimeout(() => { box.style.display = "none"; }, 3500);
  }

  function playTone(freq, duration) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  }

  function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    const config = {
      fps: 15,
      qrbox: { width: 280, height: 180 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.CODE_39
      ]
    };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
      .then(() => {
        isScanning = true;
        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;
      })
      .catch(err => alert("Camera permission error: " + err));
  }

  function stopScanner() {
    if (html5QrCode && isScanning) {
      html5QrCode.stop().then(() => {
        isScanning = false;
        document.getElementById("startBtn").disabled = false;
        document.getElementById("stopBtn").disabled = true;
      });
    }
  }

  function onScanSuccess(decodedText, decodedResult) {
    const cleanCode = decodedText.trim();

    // 1. Minimum character length (drops noisy Code 39 misreads)
    if (cleanCode.length < 4) return;

    // 2. Lockout while active to prevent reading burst frames
    if (isProcessingScan) return;

    // 3. Duplicate check
    if (scannedSet.has(cleanCode)) {
      isProcessingScan = true;
      showAlert(`⚠️ Already scanned: "${cleanCode}"`, '#fff3cd', '#856404');
      playTone(300, 0.2);
      setTimeout(() => { isProcessingScan = false; }, 1500);
      return;
    }

    // 4. Fragment handling (Code 39 sensor stabilization)
    for (let existing of scannedSet) {
      if (existing.includes(cleanCode) || cleanCode.includes(existing)) {
        if (cleanCode.length > existing.length) {
          scannedSet.delete(existing);
          const idx = scannedItems.findIndex(i => i.barcode === existing);
          if (idx !== -1) scannedItems.splice(idx, 1);
          break;
        } else {
          return;
        }
      }
    }

    isProcessingScan = true;
    scannedSet.add(cleanCode);
    playTone(900, 0.12);

    const utepTag = document.getElementById("utepTagInput").value.trim();

    const record = {
      id: scannedItems.length + 1,
      barcode: cleanCode,
      utepTag: utepTag,
      format: decodedResult.result.format ? decodedResult.result.format.formatName : "BARCODE",
      timestamp: new Date().toLocaleString()
    };

    scannedItems.push(record);
    renderTable();
    showAlert(`✅ Added #${record.id}: ${cleanCode}`);

    // Auto-sync to Google Sheets
    if (SHEETS_WEBHOOK_URL && !SHEETS_WEBHOOK_URL.includes("PASTE_YOUR_APPS_SCRIPT")) {
      fetch(SHEETS_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record)
      }).catch(err => console.error("Sheets push error:", err));
    }

    // 1.5s cool-down so you can pull the camera away without rescanning
    setTimeout(() => {
      isProcessingScan = false;
    }, 1500);
  }

  function renderTable() {
    const tbody = document.querySelector("#scansTable tbody");
    tbody.innerHTML = "";
    scannedItems.forEach((item, index) => {
      item.id = index + 1;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.id}</td>
        <td><strong>${item.barcode}</strong></td>
        <td>${item.utepTag || "-"}</td>
        <td>${item.format}</td>
        <td>${item.timestamp}</td>
      `;
      tbody.appendChild(tr);
    });
    document.getElementById("count").innerText = scannedItems.length;
  }

  function clearTable() {
    if (confirm("Reset current scan session list?")) {
      scannedItems = [];
      scannedSet.clear();
      renderTable();
    }
  }

  function exportToExcel() {
    if (scannedItems.length === 0) {
      alert("No records to export.");
      return;
    }
    const data = scannedItems.map(item => ({
      "Index": item.id,
      "Barcode Value": item.barcode,
      "UTEP TAG": item.utepTag,
      "Barcode Type": item.format,
      "Timestamp": item.timestamp
    }));

    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Barcodes");
    XLSX.writeFile(wb, `UTEP_Scans_${new Date().toISOString().slice(0,10)}.xlsx`);
  }
</script>

</body>
</html>
